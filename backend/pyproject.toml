[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartbuilding-marl"
version = "0.1.0"
description = "Occupant-aware uncertainty-calibrated MARL research backend (simulation only)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
sim = [
  "citylearn==3.5.0",
]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.27,<0.29",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
